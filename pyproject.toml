[project]
name = "wingfin-osm-scenarionet-converter"
version = "0.1.0"
description = "Acquire, normalize, audit, and inspect OpenStreetMap road data."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "geopandas>=0.14,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "osmnx>=2,<3",
  "pydantic>=2.8,<3",
  "pyproj>=3.6,<4",
  "pyyaml>=6,<7",
  "shapely>=2,<3",
  "structlog>=24,<26",
  "typer>=0.12,<1",
]

[project.scripts]
osm-scenario = "osm_scenario.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
# MetaDrive, for the tools in `tools/` -- the sweep, the drive runner, the sensor survey.
# Opt-in: `uv sync` installs only the default and dev groups, so the checkout-plus-3.8-venv
# arrangement keeps working until `uv sync --group sim` is run deliberately.
#
# Pinned to a commit, not to `==0.4.3`. The reference checkout is 32 commits past that tag
# (`git describe` -> MetaDrive-0.4.3-32-g85e5dadc) and `metadrive.constants.EDITION` reports
# "MetaDrive v0.4.3" either way, so a version pin would let two machines run different
# simulators while every step-timing CSV claimed they were the same.
sim = [
  "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@85e5dadc",
]

# The three packages MetaDrive's `image_on_cuda` path imports, so a rendered frame can stay
# in GPU memory as a CuPy array instead of being copied to the host. Opt-in beside `sim`:
# `uv sync --group sim --group gpu`.
#
# **`cuda-python` must stay below 13.** `base_camera.py:10-18` is one `try: import cupy /
# from OpenGL.GL import GL_TEXTURE_2D / from cuda import cudart ... except ImportError:
# _cuda_enable = False`, so any one of the three missing shuts the gate. It does **not**
# then fall back to the CPU: `image_on_cuda=True` trips an assert, measured offscreen as
# `AssertionError: CuPy is not enabled. Fail to set up image_on_cuda. Hint: pip install
# cupy-cuda11x or pip install cupy-cuda12x`. The hint misleads, because that assert is
# `ImageObservation.__init__`'s (`image_obs.py:57`) and gates on **cupy alone** -- so it
# names cupy even when what is missing is PyOpenGL or cuda-python. Under `--render 3D` no
# image observation is built and it is `BaseCamera.__init__` (`base_camera.py:56`) that
# fires, hinting "pip install pypiwin32". Loud either way, and `drive.py` reads
# `_cuda_enable` itself and refuses first, before the terrain build.
#
# cuda-python **removed** the top-level `cuda.cudart` shim at 13.0 in favour of
# `cuda.bindings.runtime`; measured here, 13.3.1 raises `ImportError: cannot import name
# 'cudart' from 'cuda'` and 12.9.7 imports it (with a FutureWarning). An unpinned resolve
# picks 13.3.1.
#
# **`cupy-cuda12x`, not `cupy-cuda13x`**, though the driver (595.84) offers CUDA 13.2 --
# the model stack of Phase C is pinned at cu128 and CuPy shares a process and a context
# with torch.
gpu = [
  "cupy-cuda12x[ctk]>=14,<15",
  "PyOpenGL>=3.1,<4",
  "cuda-python>=12,<13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_scenario"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
