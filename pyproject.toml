[project]
name = "wingfin-osm-scenarionet-converter"
version = "0.1.0"
description = "Convert OpenStreetMap road layouts into standalone scenario datasets."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "geopandas>=0.14,<2",
  "lanelet2>=1.2,<2",
  "numpy>=1.26,<3",
  "osmnx>=2,<3",
  "pydantic>=2.8,<3",
  "pyproj>=3.6,<4",
  "pyyaml>=6,<7",
  "shapely>=2,<3",
  "structlog>=24,<26",
  "typer>=0.12,<1",
]

[project.scripts]
osm-scenario = "osm_scenario.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_scenario"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

