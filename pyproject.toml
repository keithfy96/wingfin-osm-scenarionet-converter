[project]
name = "wingfin-osm-scenarionet-converter"
version = "0.1.0"
description = "Acquire, normalize, audit, and inspect OpenStreetMap road data."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "geopandas>=0.14,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "osmnx>=2,<3",
  "pydantic>=2.8,<3",
  "pyproj>=3.6,<4",
  "pyyaml>=6,<7",
  "shapely>=2,<3",
  "structlog>=24,<26",
  "typer>=0.12,<1",
]

[project.scripts]
osm-scenario = "osm_scenario.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
# MetaDrive, for the tools in `tools/` -- the sweep, the drive runner, the sensor survey.
# Opt-in: `uv sync` installs only the default and dev groups, so the checkout-plus-3.8-venv
# arrangement keeps working until `uv sync --group sim` is run deliberately.
#
# Pinned to a commit, not to `==0.4.3`. The reference checkout is 32 commits past that tag
# (`git describe` -> MetaDrive-0.4.3-32-g85e5dadc) and `metadrive.constants.EDITION` reports
# "MetaDrive v0.4.3" either way, so a version pin would let two machines run different
# simulators while every step-timing CSV claimed they were the same.
sim = [
  "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@85e5dadc",
]

# The three packages MetaDrive's `image_on_cuda` path imports, so a rendered frame can stay
# in GPU memory as a CuPy array instead of being copied to the host. Opt-in beside `sim`:
# `uv sync --group sim --group gpu`.
#
# **`cuda-python` must stay below 13.** `base_camera.py:10-18` is one `try: import cupy /
# from OpenGL.GL import GL_TEXTURE_2D / from cuda import cudart ... except ImportError:
# _cuda_enable = False`, so any one of the three missing shuts the gate. It does **not**
# then fall back to the CPU: `image_on_cuda=True` trips an assert, measured offscreen as
# `AssertionError: CuPy is not enabled. Fail to set up image_on_cuda. Hint: pip install
# cupy-cuda11x or pip install cupy-cuda12x`. The hint misleads, because that assert is
# `ImageObservation.__init__`'s (`image_obs.py:57`) and gates on **cupy alone** -- so it
# names cupy even when what is missing is PyOpenGL or cuda-python. Under `--render 3D` no
# image observation is built and it is `BaseCamera.__init__` (`base_camera.py:56`) that
# fires, hinting "pip install pypiwin32". Loud either way, and `drive.py` reads
# `_cuda_enable` itself and refuses first, before the terrain build.
#
# cuda-python **removed** the top-level `cuda.cudart` shim at 13.0 in favour of
# `cuda.bindings.runtime`; measured here, 13.3.1 raises `ImportError: cannot import name
# 'cudart' from 'cuda'` and 12.9.7 imports it (with a FutureWarning). An unpinned resolve
# picks 13.3.1.
#
# **`cupy-cuda12x`, not `cupy-cuda13x`**, though the driver (595.84) offers CUDA 13.2 --
# the model stack of Phase C is pinned at cu128 and CuPy shares a process and a context
# with torch.
gpu = [
  "cupy-cuda12x[ctk]>=14,<15",
  "PyOpenGL>=3.1,<4",
  "cuda-python>=12,<13",
]

# The model stack of Stage 9 Phase C: the AV3 checkpoint the openpilot bridge is driven by.
# Opt-in beside `sim` and `gpu` -- `uv sync` with no flags still installs only the default and
# `dev` groups.
#
# **The three versions are pinned to what compiled the engine, and the checkpoint says so
# itself.** `step_440000_trt_direct_full.ep` is a `pt2` archive whose `models/model.json`
# records `"torch_version": "2.8.0+cu128"`, so this is evidence read out of the file rather
# than a README repeated. It matters more here than a version pin usually does: the archive's
# 1.275 GB constant is a **serialized TensorRT engine**, built against one SM architecture and
# one TensorRT version, so a mismatched stack does not degrade -- it fails to deserialize.
# `tests/unit/test_model_probe.py` checks the pin against the archive rather than trusting
# this comment.
#
# **numpy is deliberately not pinned here.** `wing-sim/evaluation/pyproject.toml` carries
# `numpy==1.26.4` beside the identical torch pins; this repo is numpy 2.2.6 and the whole of
# `tools/` runs against it. Adopting that pin to be safe would be the one change here able to
# break code that already works.
model = [
  "torch==2.8.0",
  "torch-tensorrt==2.8.0",
  "tensorrt==10.12.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Resolve only for the platform this runs on. Without it uv solves every environment,
# including impossible ones: on aarch64 + tegra `torch-tensorrt` pins a Jetson TensorRT
# `<10.4` against the `==10.12.0.36` above and the lock fails outright. Linux x86_64 is the
# only target either the host or the container has ever been.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# torch and torch-tensorrt come from the cu128 wheel index rather than PyPI, and tensorrt from
# NVIDIA's own. `explicit = true` keeps every other dependency resolving from PyPI as before.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torch-tensorrt = { index = "pytorch-cu128" }
tensorrt = { index = "nvidia" }

[tool.hatch.build.targets.wheel]
packages = ["src/osm_scenario"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The bridge image's build context: the zapeta bridge server and the vendored openpilot fork.
# All of it is Python **3.8** -- it runs inside the ubuntu 20.04 bridge image, never in this venv
# -- so `target-version` above does not describe it, and ruff's own advice is actively wrong for
# it: UP041 would rewrite `except socket.timeout` to `except TimeoutError`, which is that alias
# only from 3.10. `deps/openpilot/` is 309 MB of another project's source besides, and linting it
# reports 6864 findings against code this repo does not own and must not reformat -- the tree is
# a byte-for-byte copy of the commit the AV3 checkpoint was compiled against, and that property
# is the only thing making it verifiable. Excluded whole, deliberately.
extend-exclude = ["docker/openpilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
