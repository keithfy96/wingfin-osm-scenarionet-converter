# The sweep, the drive runner and the sensor survey, in one environment that can be carried to
# another machine. `docker/Dockerfile` has the reasoning; this file has the wiring.
#
#   cd scripts && ./step-timing-docker.sh mosque -- --rows 2,6
#   docker compose run --rm sim uv run pytest -q
#   docker compose run --rm sim bash
#
# And the AV3 model, which lives in the same container -- set MODEL_DIR in .env first:
#
#   docker compose run --rm sim scripts/av3-probe.sh junction-1 -- --step-hz 100 --decision-hz 20
# The compose project name, which prefixes every container this file starts. Without it compose
# takes the name from the directory -- `wingfin-osm-scenarionet-converter` -- and `docker ps`
# then shows a name that is one letter from a colleague's `wing-sim` project. Everything this
# repo builds or runs is `metadrive-wingfin-*` on purpose.
name: metadrive-wingfin

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: metadrive-wingfin-sim
    gpus: all
    working_dir: /work

    # The host's uid, or every CSV this writes into the mounted workspace belongs to root. There
    # is no matching entry in the image's /etc/passwd, which is why the image sets HOME=/tmp.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"

    # Not convenience: row 3 of the sweep times a round trip to --policy-url, and that trip is
    # 0.126 ms with TCP_NODELAY set on both ends against 41.0 ms without it. A bridge network in
    # front of a number that small would corrupt the row it exists to produce. It also means
    # examples/policy_server.py can run inside the container or outside it and 127.0.0.1 reaches
    # it either way.
    network_mode: host

    volumes:
      # The repo, live. /opt/venv is outside it, so this does not shadow the environment and a
      # `uv run` in here cannot resync the host's own .venv.
      - .:/work
      # Where a camera-rig spec lives. Set RIG_DIR in .env to the directory holding it; the
      # fallback is docker/rig/, which exists so an unset RIG_DIR cannot make docker create a
      # root-owned directory in $HOME.
      - "${RIG_DIR:-./docker/rig}:/rig:ro"
      # The AV3 checkpoint. Not baked into the image: the .ep is 1.26 GB, it belongs to the
      # openpilot fork rather than to this repo, and a layer holding it travels wherever the
      # image does. Set MODEL_DIR in .env to the directory holding it. Same fallback reasoning
      # as RIG_DIR.
      #
      # **The .ep alone.** model_dev.yml used to have to sit here beside it, and that is what
      # MODEL_CONFIG below no longer asks for: the yml is tracked at config/model_dev.yml and
      # reached through the /work mount instead. `av3_model.load_config` requires every field in
      # it and defaults none, so a directory that was missing it failed at load with nothing in
      # the message naming the cause -- which is exactly how a rig lost half a morning.
      - "${MODEL_DIR:-./docker/model}:/models:ro"
      # The host's clock. Without this the image has no /etc/localtime and no zoneinfo, so glibc
      # falls back to UTC -- and a step-timing CSV, whose whole index is the stamp in its name,
      # comes out 8 hours adrift of a run made outside the container on the same machine. Docker
      # resolves the host's symlink and mounts the TZif file itself, which is all glibc needs when
      # TZ is unset. A TZ variable would not do: resolving "Asia/Singapore" needs
      # /usr/share/zoneinfo, which the image does not carry.
      - /etc/localtime:/etc/localtime:ro
      # The host's user list, read-only, because the container runs as the host's uid and the
      # image has no /etc/passwd entry for it -- so `pwd.getpwuid(os.getuid())` raises. That is
      # not hypothetical: torch_tensorrt calls it at **module scope**
      # (`dynamo/_defaults.py:64`), purely to name a temp debug-log directory, so
      # `import torch_tensorrt` dies with `KeyError: 'getpwuid(): uid not found: 1000'` and the
      # model cannot load at all. Measured in this container before this line existed.
      # HOME=/tmp in the image covers the *home directory* half of the same problem; this is the
      # *name* half, which nothing else supplies. Read-only, and only the name field is read.
      - /etc/passwd:/etc/passwd:ro

    environment:
      # Names the machine in every row of a step-timing CSV and in the file name. The hostname is
      # a random id in a container, so this matters more here than anywhere else.
      STEP_TIMING_LABEL: "${STEP_TIMING_LABEL:-container}"

      # Where the two model files are, in the container's own paths -- so `av3-probe.sh` and
      # `drive.py --model-checkpoint` need no arguments in here that they do not need outside.
      # Setting either in .env overrides it, which is what a second checkpoint is for. The host
      # defaults are absolute paths into the fork checkout (`model_probe.DEFAULT_CHECKPOINT`,
      # `av3_model.DEFAULT_CONFIG`) and do not exist in here, so these are what make the model
      # runnable in the container at all.
      #
      # **The two files do not come from the same place, and that is deliberate.** The checkpoint
      # is 1.2 GB and cannot be in git, so it is the one thing a rig has to be handed by hand:
      # MODEL_DIR, mounted read-only at /models above. The config beside it is 4.3 KB of text
      # that pins the settings the weights were trained with -- so it IS in git, at
      # config/model_dev.yml, and the repo is already mounted at /work. Pointing at it there
      # rather than at /models is what makes MODEL_DIR a directory holding **one** file.
      #
      # That is not hypothetical tidying: model_dev.yml was in no git repository at all until
      # 2e686a2. It came out of the fork's assets.zip, which is why vendoring the fork missed it
      # -- the vendored tree is wingfin-openpilot-temp/openpilot/ and the config sits in the
      # sibling assets/. A rig got its .ep copied across and not the yml, and failed at load with
      # nothing in the message naming what was missing.
      #
      # The pair is a pair: the yml names `checkpoint: step_440000_trt_direct_full.ep` and a
      # route_path inside itself, so the tracked copy is the default pair and not the only one.
      # A second checkpoint brings its own, through MODEL_CONFIG.
      MODEL_CHECKPOINT: "${MODEL_CHECKPOINT:-/models/step_440000_trt_direct_full.ep}"
      MODEL_CONFIG: "${MODEL_CONFIG:-/work/config/model_dev.yml}"

    stdin_open: true
    tty: true
